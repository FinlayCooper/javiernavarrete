<meta name="Description" content="Teruel sXIII: The youthful Juan de Marcilla receives an invitation to follow War and Death in 'the raven dance' 
Hoping to earn money and honor, he accepts, attempting to prove that he is worthy of marrying his lover: the noble Isabel de Segura.
Five years later he returns home sickly and wounded, only to find that Isabel has married Don Pedro de Azagra,
Visited in his dreams by Saint Cosme and Saint Damian, he learns that he must accept the cards he has been dealt or he will die...
But then again..." />
